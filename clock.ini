; ============================================================
;  ヤシマ作戦クロック — NTP 設定
;  起動のたびに、ここで指定したサーバへ時刻を問い合わせます。
;  このファイルを書き換えて保存し、ページを再読み込みしてください。
; ============================================================

[ntp]
; ホスト名のみ（プロトコル不要）。NTP ポートは 123 固定です。
; 例:
;   ntp.nict.jp              … 情報通信研究機構（日本標準時）
;   ntp-a1.nict.go.jp
;   ntp.jst.mfeed.ad.jp      … Internet Multifeed
;   time.google.com
;   time.cloudflare.com
;   ntp.ubuntu.com
server = ntp.nict.jp

; 問い合わせタイムアウト（ミリ秒）
timeout_ms = 2500
